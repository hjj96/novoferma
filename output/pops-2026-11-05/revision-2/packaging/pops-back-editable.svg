<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1450" viewBox="0 0 1800 1450"><title>Новоферма. Попсы — оборотная сторона. Рабочий макет</title><rect width="1800" height="1450" fill="#F7EEDD"/><image href="data:image/webp;base64," x="110" y="70" width="370" height="80" preserveAspectRatio="xMidYMid meet"/><text x="110" y="310" font-family="Georgia" font-size="154" font-weight="normal" text-anchor="start" fill="#55300B" >ПОПСЫ</text><text x="115" y="390" font-family="Arial" font-size="44" font-weight="normal" text-anchor="start" fill="#55300B" >Мини-наггетсы из курицы в хрустящей панировке</text><text x="115" y="470" font-family="Arial" font-size="36" font-weight="normal" text-anchor="start" fill="#55300B" >Маленькие куриные кусочки. Подавайте с любимым соусом.</text><text x="115" y="570" font-family="Arial" font-size="26" font-weight="bold" text-anchor="start" fill="#80654D" letter-spacing="2">ОБОРОТНАЯ СТОРОНА · ПОЛЯ ДЛЯ ДАННЫХ ПРОИЗВОДСТВА</text><text x="115" y="665" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Состав и аллергены</text><text x="115" y="723" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Утверждённый состав и выделенные аллергены]</text><text x="115" y="835" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Приготовление</text><text x="115" y="893" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Способ, время и температура после испытаний]</text><text x="115" y="1005" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Хранение и срок годности</text><text x="115" y="1063" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Режим хранения, срок, условия после вскрытия]</text><text x="115" y="1175" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Изготовитель</text><text x="115" y="1233" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Наименование, адрес, контакты, документы]</text><text x="1045" y="665" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Пищевая ценность</text><text x="1045" y="723" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Белки, жиры, углеводы на 100 г]</text><text x="1045" y="768" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Энергетическая ценность]</text><text x="1045" y="875" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Масса нетто</text><text x="1045" y="933" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Утверждённая масса]</text><text x="1045" y="1045" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Дата и партия</text><text x="1045" y="1103" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Зона нанесения переменных данных]</text><text x="1045" y="1215" font-family="Arial" font-size="39" font-weight="bold" text-anchor="start" fill="#55300B" >Штрихкод и знаки</text><text x="1045" y="1273" font-family="Arial" font-size="26" font-weight="normal" text-anchor="start" fill="#80654D" >[Зона после регистрации и проверки]</text><text x="115" y="1400" font-family="Arial" font-size="24" font-weight="normal" text-anchor="start" fill="#80654D" letter-spacing="2">РАБОЧИЙ МАКЕТ · ЗАПОЛНИТЬ И ПРОВЕРИТЬ ПЕРЕД ПЕЧАТЬЮ</text></svg>